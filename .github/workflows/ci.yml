name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Race detection
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          go build -trimpath -o "build/bm${suffix}" ./cmd/bm
          "./build/bm${suffix}" version --json
          test "$(cat skills/_shared/VERSION)" = "1.1.0"

  python-checks:
    name: Auxiliary Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build official CLI
        run: go build -trimpath -o /tmp/bm ./cmd/bm

      - name: Validate maintained Python files
        run: |
          python -m py_compile scripts/bm.py scripts/run_service_example.py scripts/run_test_shards.py tests/test_cli_help.py tests/test_method_package.py
          python -m unittest tests.test_cli_help tests.test_method_package

      - name: Exercise public service journey
        run: python scripts/run_service_example.py --binary /tmp/bm --protocol-test
