name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate Python syntax
        run: |
          python3 -m py_compile \
            scripts/bm.py \
            scripts/bm_python_oracle.py \
            skills/_shared/scripts/bm.py \
            skills/_shared/scripts/bm_feature_support.py \
            skills/_shared/scripts/bm_context.py \
            skills/_shared/scripts/bm_spec_diff.py \
            skills/_shared/scripts/bm_mutation.py \
            skills/_shared/scripts/bm_scope.py \
            skills/_shared/scripts/bm_update.py \
            tests/test_method_package.py \
            tests/test_context_efficiency.py \
            tests/test_context_efficiency_review.py \
            tests/test_self_update.py

      - name: Run complete sharded suite
        run: python3 scripts/run_test_shards.py

      - name: Validate native backend
        run: |
          go test ./...
          go vet ./...
          go build -trimpath -o /tmp/bm ./cmd/bm

      - name: Validate CLI entrypoints
        run: |
          /tmp/bm version --json | python3 -c 'import json, sys; assert json.load(sys.stdin)["official"] is True'
          python3 scripts/run_cli_contract_fixtures.py --engine go --binary /tmp/bm
          test "$(cat skills/_shared/VERSION)" = "0.6.0"

  windows-portability:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate packaged Python modules
        shell: pwsh
        run: |
          python -m unittest tests.test_windows_portability
          python -c "import sys; sys.path.insert(0, r'skills/_shared/scripts'); import bm"

      - name: Validate native Windows CLI
        shell: pwsh
        run: |
          go build -trimpath -o bm.exe ./cmd/bm
          .\bm.exe version --json | python -c "import json, sys; assert json.load(sys.stdin)['official'] is True"
