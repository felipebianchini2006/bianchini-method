name: Bootstrap Context Efficiency

on:
  push:
    branches:
      - feat/context-efficiency-v3.1

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: bootstrap context efficiency implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply tests first
        run: python3 .github/bootstrap/apply_tests.py

      - name: RED
        shell: bash
        run: |
          set +e
          cd tests
          python3 -m unittest test_method_package.ContextEfficiencyScenarios -v > /tmp/context-red.log 2>&1
          status=$?
          cat /tmp/context-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Os testes novos passaram antes da implementação.' >&2
            exit 1
          fi
          echo 'RED confirmado.'

      - name: Apply implementation
        run: python3 .github/bootstrap/apply_impl.py

      - name: Validate syntax
        shell: bash
        run: |
          python3 -m py_compile \
            skills/_shared/scripts/bm.py \
            skills/_shared/scripts/bm_feature_support.py \
            skills/_shared/scripts/bm_context.py \
            skills/_shared/scripts/bm_spec_diff.py \
            skills/_shared/scripts/bm_mutation.py \
            tests/test_method_package.py

      - name: GREEN
        run: |
          cd tests
          python3 -m unittest test_method_package.ContextEfficiencyScenarios -v

      - name: Full validation
        shell: bash
        run: |
          git diff --check
          python3 scripts/run_test_shards.py
          python3 scripts/bm.py --help > /tmp/bm-help.txt
          grep -q 'spec-diff' /tmp/bm-help.txt
          grep -q 'mutation-evidence' /tmp/bm-help.txt

      - name: Commit implementation
        shell: bash
        run: |
          rm -rf .github/bootstrap
          git config user.name 'Bianchini Method CI'
          git config user.email '53955955+felipebianchini2006@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add deterministic context efficiency tools [skip ci]'
          git push origin HEAD:feat/context-efficiency-v3.1
