name: Finalize Context Efficiency v3.1

on:
  push:
    branches:
      - feat/context-efficiency-v3.1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/context-efficiency-v3.1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply idempotent v3.1 integration
        run: python3 scripts/apply_context_efficiency_v31.py

      - name: Run complete sharded suite
        run: python3 scripts/run_test_shards.py

      - name: Validate CLI entrypoint and new commands
        run: |
          python3 scripts/bm.py --help
          python3 scripts/bm.py spec-diff --help
          python3 scripts/bm.py mutation-evidence --help
          python3 scripts/bm.py task-brief --help

      - name: Remove one-time integration assets
        run: |
          rm -f scripts/apply_context_efficiency_v31.py
          rm -f .github/workflows/apply-context-efficiency-v31.yml
          rm -f .github/workflows/apply-context-efficiency-v31-trigger.yml
          rm -f .github/workflows/finalize-context-efficiency-v31.yml

      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit."
          else
            git commit -m "feat: release context efficiency v3.1"
          fi

      - name: Push verified release to feature branch and main
        run: |
          git push origin HEAD:feat/context-efficiency-v3.1
          git push origin HEAD:main
