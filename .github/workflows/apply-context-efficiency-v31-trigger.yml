name: Apply Context Efficiency v3.1 Trigger

on:
  push:
    branches:
      - feat/context-efficiency-v3.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/context-efficiency-v3.1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply deterministic integration patch
        run: python3 scripts/apply_context_efficiency_v31.py

      - name: Run complete sharded suite
        run: python3 scripts/run_test_shards.py

      - name: Validate CLI entrypoint
        run: python3 scripts/bm.py --help

      - name: Commit verified integration
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md scripts/bm.py skills tests
          git commit -m "feat: add context efficiency layer"
          git push origin HEAD:feat/context-efficiency-v3.1
