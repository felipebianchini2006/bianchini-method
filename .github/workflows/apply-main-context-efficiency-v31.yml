name: Apply Context Efficiency v3.1 on Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Import bootstrap tree when needed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v31-bootstrap
          if ! grep -q "quality_v2_unit_contract_errors" skills/_shared/scripts/bm.py; then
            git merge --squash origin/v31-bootstrap
          fi
          test -f skills/_shared/scripts/bm_context_efficiency.py
          test -f tests/test_context_efficiency.py
          test -f scripts/bootstrap_context_efficiency_v31.py || grep -q "Context Efficiency" README.md

      - name: Apply deterministic integration
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/bootstrap_context_efficiency_v31.py ]; then
            python3 scripts/bootstrap_context_efficiency_v31.py
          fi
          grep -q "quality_v2_unit_contract_errors" skills/_shared/scripts/bm.py
          grep -q "mutation-evidence" skills/_shared/scripts/bm.py
          grep -q '^# Bianchini Method v3.1 — Context Efficiency$' README.md

      - name: Remove bootstrap and one-time workflows
        shell: bash
        run: |
          rm -f scripts/apply_context_efficiency_v31.py
          rm -f scripts/bootstrap_context_efficiency_v31.py
          rm -f .github/workflows/apply-context-efficiency-v31.yml
          rm -f .github/workflows/apply-context-efficiency-v31-trigger.yml
          rm -f .github/workflows/finalize-context-efficiency-v31.yml
          rm -f .github/workflows/ensure-context-efficiency-v31.yml
          rm -f .github/workflows/apply-main-context-efficiency-v31.yml

      - name: Run complete sharded suite
        run: python3 scripts/run_test_shards.py

      - name: Validate CLI commands
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bm.py --help
          python3 scripts/bm.py task-brief --help
          python3 scripts/bm.py spec-diff --help
          python3 scripts/bm.py mutation-evidence --help

      - name: Commit and push verified main tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: release Context Efficiency v3.1"
          fi
          git push origin HEAD:main
